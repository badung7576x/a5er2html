<!DOCTYPE html>
<!--
  A5ER Viewer — self-contained HTML renderer.
  Generated by a5er2html.py; parsed diagram data is injected into the JSON
  script tag below (__A5ER_DATA__ placeholder). No network resources.
  Single-file document: HTML + CSS + JS intentionally co-located.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>A5ER Viewer</title>
<style>
  :root {
    --bg: #eef1f5; --card: #ffffff; --head: #1e3a5f;
    --ink: #1a2332; --muted: #5b6b7f; --line: #64748b;
    --accent: #d97706; --pk: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo,
                 "Noto Sans CJK JP", sans-serif;
    background: var(--bg); color: var(--ink); overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: #fff; border-bottom: 1px solid #d8dee7;
    box-shadow: 0 1px 3px rgba(15,23,42,.08);
  }
  header h1 { font-size: 14px; font-weight: 700; margin: 0; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  #meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    border: 1px solid #cbd5e1; background: #f8fafc; color: var(--ink);
    font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .tabs button.on { background: var(--head); color: #fff; border-color: var(--head); }
  #search { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #search input {
    width: 220px; padding: 5px 10px; font-size: 12px;
    border: 1px solid #cbd5e1; border-radius: 6px; outline: none;
  }
  #search input:focus { border-color: #2d5081; }
  #hits { font-size: 11px; color: var(--muted); min-width: 70px; }
  .tools { display: flex; gap: 4px; align-items: center; }
  .tools button, #modeBtn {
    border: 1px solid #cbd5e1; background: #f8fafc; font-size: 12px;
    padding: 5px 9px; border-radius: 6px; cursor: pointer; color: var(--ink);
  }
  .tools button:hover, #modeBtn:hover { background: #e8eef5; }
  #zoomPct { font-size: 11px; color: var(--muted); width: 42px; text-align: center; }
  main { position: relative; flex: 1; min-height: 0; }
  #viewport { width: 100%; height: 100%; display: block; cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #viewport text { user-select: none; }
  .entity .card-bg { fill: var(--card); stroke: #8296ad; stroke-width: 1; }
  .entity .card-head { fill: var(--head); }
  .entity:hover .card-bg, .entity.sel .card-bg { stroke: var(--accent); stroke-width: 2; }
  .entity text { font-size: 11px; }
  .entity .head-l { fill: #fff; font-weight: 700; }
  .entity .head-p { fill: #c7d6ea; font-size: 10px; }
  .entity .fname { fill: var(--ink); }
  .entity .frow.pk .fname { font-weight: 700; }
  .entity .fkey { fill: var(--pk); font-size: 10px; }
  .entity .fkey.fk { fill: #2563eb; }
  .entity .ftype { fill: #6d28d9; font-size: 10px;
                   font-family: ui-monospace, Menlo, monospace; }
  .entity .fnn { fill: #94a3b8; font-size: 9px; }
  .entity .rline { stroke: #e2e8f0; stroke-width: 1; }
  .entity.dim { opacity: .12; }
  .entity .frow.dim { opacity: .25; }
  #tip { position: fixed; z-index: 10; display: none; max-width: 340px;
         background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
         box-shadow: 0 6px 20px rgba(15,23,42,.18); padding: 8px 10px;
         font-size: 11px; pointer-events: none; }
  #tip .t-name { font-weight: 700; font-size: 12px; margin-bottom: 4px; }
  #tip .t-sub { color: var(--muted); font-family: ui-monospace, Menlo, monospace;
                margin-bottom: 4px; }
  #tip table { border-collapse: collapse; }
  #tip td { padding: 1px 8px 1px 0; vertical-align: top; }
  #tip td:first-child { color: var(--muted); white-space: nowrap; }
  #tip .t-cmt { max-width: 300px; white-space: pre-wrap; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .edge:hover, .edge.edge-sel { stroke: var(--accent); stroke-width: 2.4; }
  .edge.dim { opacity: .07; }
  .edge .deco { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .edge:hover .deco, .edge.edge-sel .deco { stroke: var(--accent); stroke-width: 1.8; }
  .note-box { fill: #fef4c5; stroke: #d4a72c; }
  .note-text { font-size: 11px; color: #6b5413; line-height: 1.35; }
  footer {
    display: flex; gap: 14px; padding: 4px 14px; font-size: 11px; color: var(--muted);
    background: #fff; border-top: 1px solid #d8dee7;
  }
  kbd { font-size: 10px; border: 1px solid #cbd5e1; border-radius: 3px; padding: 0 4px; }
  #empty { position: absolute; inset: 0; display: none; place-items: center;
           color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1 id="docTitle">A5ER Viewer</h1>
  <span id="meta"></span>
  <div class="tabs" id="tabs"></div>
  <div id="search">
    <input id="q" type="search" placeholder="Search table / field…  ( / )" />
    <span id="hits"></span>
  </div>
  <button id="modeBtn" title="Toggle name display mode">Logical+Physical</button>
  <div class="tools">
    <button id="zOut" title="Zoom out">−</button>
    <span id="zoomPct">100%</span>
    <button id="zIn" title="Zoom in">+</button>
    <button id="zFit" title="Fit to view (0)">Fit</button>
    <button id="z100" title="Actual size (1)">1:1</button>
  </div>
</header>
<main>
  <svg id="viewport" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="#c9d2dd"></circle>
      </pattern>
    </defs>
    <g id="bg"><rect x="-50000" y="-50000" width="200000" height="200000" fill="url(#grid)" opacity=".55"/></g>
    <g id="world"></g>
  </svg>
  <div id="empty">This file contains no entities to display.</div>
  <div id="tip"></div>
</main>
<footer>
  <span id="stats"></span>
  <span style="margin-left:auto">
    <kbd>drag</kbd> pan · <kbd>wheel</kbd> zoom · <kbd>0</kbd> fit ·
    <kbd>/</kbd> search · click card = highlight relation
  </span>
</footer>

<script id="a5er-data" type="application/json">__A5ER_DATA__</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('a5er-data').textContent);

/* ------------------------------------------------------------------ state */
const MODES = ['logical', 'physical', 'both'];
const MODE_LABEL = { logical: 'Logical', physical: 'Physical', both: 'Logical+Physical' };
const S = {
  page: DATA.pages[0] || 'MAIN',
  mode: 'both',
  q: '',
  view: { x: 0, y: 0, s: 1 },
};
const world = document.getElementById('world');
const viewport = document.getElementById('viewport');

/* ------------------------------------------------------------- utilities */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const up = s => String(s || '').toUpperCase();
function textW(s, size = 11) {
  let w = 0;
  for (const ch of String(s ?? '')) w += ch.codePointAt(0) > 0x2e7f ? size * 1.05 : size * .62;
  return w;
}

/* Indexing. Page keys are case-insensitive ('Main' == 'MAIN'). */
const byPage = new Map();  // PAGE -> entity[]
const byName = new Map();  // upper(pName) -> entity
for (const e of DATA.entities) {
  const p = up(e.page) || 'MAIN';
  if (!byPage.has(p)) byPage.set(p, []);
  byPage.get(p).push(e);
  if (e.pName) byName.set(up(e.pName), e);
}
const fkSet = new Set();   // upper(entity) \0 upper(field) -> is FK target
for (const r of DATA.relations) for (const f of r.fields2)
  fkSet.add(up(r.entity2) + '\u0000' + up(f));

/* ---------------------------------------------------------------- layout */
const ROW_H = 18, PAD = 3;
const geo = new Map();     // upper(pName) -> {x, y, W, H, hh}

function nameOf(item) {    // entity or field, per view mode
  const l = item.lName || item.pName || '', p = item.pName || '';
  return S.mode === 'physical' ? (p || l) : (l || p);
}

function layoutEntity(e) {
  const hh = S.mode === 'both' ? 38 : 24;
  let maxW = textW(nameOf(e)) + 24;
  for (const f of e.fields) {
    let w = 30 + textW(nameOf(f));
    if (S.mode !== 'logical')
      w += 12 + textW(f.type, 10);
    if (w > maxW) maxW = w;
  }
  const W = Math.max(170, Math.min(480, Math.ceil(maxW + 18)));
  const H = hh + e.fields.length * ROW_H + PAD * 2;
  geo.set(up(e.pName), { x: e.x, y: e.y, W, H, hh });
}

function rowAnchorY(g, entity, fields) {
  if (fields && fields.length) {
    const e = byName.get(up(entity));
    const idx = e ? e.fields.findIndex(
      f => up(f.pName) === up(fields[0]) || up(f.lName) === up(fields[0])) : -1;
    if (idx >= 0) return g.hh + PAD + idx * ROW_H + ROW_H / 2;
  }
  return g.hh / 2;
}

/* --------------------------------------------------------------- builders */
function entitySvg(e, m) {   // m: null=no query, undefined=no match, object=match
  const g = geo.get(up(e.pName));
  const { W, H, hh } = g;
  let s = `<g class="entity" data-name="${esc(up(e.pName))}" transform="translate(${e.x} ${e.y})">`;
  s += `<rect class="card-bg" width="${W}" height="${H}" rx="4"/>`;
  s += `<rect class="card-head" x="1" y="1" width="${W - 2}" height="${hh}" rx="3"/>`;
  if (S.mode === 'both') {
    s += `<text class="head-l" x="8" y="15">${esc(nameOf(e))}</text>`;
    s += `<text class="head-p" x="8" y="29">${esc(e.pName || '')}</text>`;
  } else {
    s += `<text class="head-l" x="8" y="${Math.ceil(hh / 2) + 4}">${esc(nameOf(e))}</text>`;
  }
  e.fields.forEach((f, i) => {
    const y = hh + PAD + i * ROW_H;
    const isPk = !!f.pk;
    const fk = !isPk && fkSet.has(up(e.pName) + '\u0000' + up(f.pName));
    const dim = m && !m.whole && !m.fields.has(i);
    const hl = m && m.fields.has(i) && !m.whole;
    let row = `<g class="frow${isPk ? ' pk' : ''}${dim ? ' dim' : ''}${hl ? ' hl' : ''}" data-idx="${i}">`;
    if (i) row += `<line class="rline" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
    const ty = y + 13;
    if (isPk) row += `<text class="fkey" x="7" y="${ty}">&#128273;</text>`;
    else if (fk) row += `<text class="fkey fk" x="7" y="${ty}">&#128279;</text>`;
    row += `<text class="fname" x="26" y="${ty}">${esc(nameOf(f))}</text>`;
    if (S.mode !== 'logical') {
      const nn = f.nullConstraint === 'NOT NULL';
      row += `<text class="ftype" x="${nn ? W - 26 : W - 8}" y="${ty}" text-anchor="end">${esc(f.type)}</text>`;
      if (nn) row += `<text class="fnn" x="${W - 8}" y="${ty}" text-anchor="end">NN</text>`;
    }
    row += '</g>';
    s += row;
  });
  s += '</g>';
  return s;
}

function noteSvg(n) {
  const W = 230, LH = 16;
  const lines = Math.max(1, Math.ceil(textW(n.text) / (W - 16) / .58));
  const H = Math.max(34, 18 + lines * LH);
  return `<g class="note" transform="translate(${n.x} ${n.y})">
    <rect class="note-box" width="${W}" height="${H}" rx="3"/>
    <foreignObject x="6" y="5" width="${W - 12}" height="${H - 10}">
      <div xmlns="http://www.w3.org/1999/xhtml" class="note-text">${esc(n.text)}</div>
    </foreignObject></g>`;
}

/* Orthogonal edge, crow's-foot on many side, one-tick on one side. */
function edgeSvg(r) {
  const g1 = geo.get(up(r.entity1)), g2 = geo.get(up(r.entity2));
  if (!g1 || !g2) return '';
  const c1 = { x: g1.x + g1.W / 2, y: g1.y + g1.H / 2 };
  const c2 = { x: g2.x + g2.W / 2, y: g2.y + g2.H / 2 };
  const dx = c2.x - c1.x, dy = c2.y - c1.y;
  const horizontal = Math.abs(dx) > Math.abs(dy) * 1.15;
  const clampY = (g, y) => Math.min(g.y + g.H - 4, Math.max(g.y + g.hh, y));
  let a1, a2, d;
  if (horizontal) {
    a1 = { x: dx > 0 ? g1.x + g1.W : g1.x, y: clampY(g1, g1.y + rowAnchorY(g1, r.entity1, r.fields1)) };
    a2 = { x: dx > 0 ? g2.x : g2.x + g2.W, y: clampY(g2, g2.y + rowAnchorY(g2, r.entity2, r.fields2)) };
    d = { x: Math.sign(dx) || 1, y: 0 };
  } else {
    a1 = { x: c1.x, y: dy > 0 ? g1.y + g1.H : g1.y };
    a2 = { x: c2.x, y: dy > 0 ? g2.y : g2.y + g2.H };
    d = { x: 0, y: Math.sign(dy) || 1 };
  }
  const n = { x: -d.y, y: d.x };
  const back1 = r.entity1Many ? 12 : 6, back2 = r.entity2Many ? 12 : 6;
  const start = { x: a1.x + d.x * back1, y: a1.y + d.y * back1 };
  const end = { x: a2.x - d.x * back2, y: a2.y - d.y * back2 };
  const P = horizontal
    ? [start, { x: (start.x + end.x) / 2, y: start.y }, { x: (start.x + end.x) / 2, y: end.y }, end]
    : [start, { x: start.x, y: (start.y + end.y) / 2 }, { x: end.x, y: (start.y + end.y) / 2 }, end];
  const path = P.map((p, i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`).join(' ');
  const fan = at => {
    const b = { x: at.x - d.x * 12, y: at.y - d.y * 12 };
    return `M ${b.x + n.x * 5} ${b.y + n.y * 5} L ${at.x} ${at.y}` +
           ` M ${b.x} ${b.y} L ${at.x} ${at.y}` +
           ` M ${b.x - n.x * 5} ${b.y - n.y * 5} L ${at.x} ${at.y}`;
  };
  const tickAt = (at, dd) => {
    const b = { x: at.x - dd.x * 6, y: at.y - dd.y * 6 };
    const nn = { x: -dd.y, y: dd.x };
    return `M ${b.x + nn.x * 5} ${b.y + nn.y * 5} L ${b.x - nn.x * 5} ${b.y - nn.y * 5}`;
  };
  let deco = r.entity2Many ? fan(a2) : tickAt(a2, d);
  return `<g class="edge" data-e="${esc(up(r.entity1))}" data-t="${esc(up(r.entity2))}">` +
    `<path d="${path}"></path>` +
    `<path class="deco" d="${deco}"></path></g>`;
}

/* Query match per entity: null=no query, undefined=no match, object=match. */
function matchEntity(e) {
  if (!S.q) return null;
  const q = S.q.toLowerCase();
  const whole = (up(nameOf(e)) + ' ' + up(e.pName) + ' ' + (e.comment || '')).toLowerCase().includes(q);
  const fields = new Set();
  e.fields.forEach((f, i) => {
    if ([nameOf(f), f.pName, f.type, f.comment].join(' ').toLowerCase().includes(q))
      fields.add(i);
  });
  return whole || fields.size ? { fields, whole } : undefined;
}

/* Assemble full SVG inner string. Pass 2 uses measured text widths. */
function buildSvg() {
  const ents = byPage.get(up(S.page)) || [];
  ents.forEach(layoutEntity);                       // pass 1: estimated widths
  let s = '';

  const inPage = r => {
    const p1 = up(byName.get(up(r.entity1))?.page) || 'MAIN';
    const p2 = up(byName.get(up(r.entity2))?.page) || 'MAIN';
    return p1 === up(S.page) && p2 === up(S.page);
  };
  const matched = ents.map(e => ({ e, m: matchEntity(e) }));
  const entStrs = matched.map(({ e, m }) => entitySvg(e, m));
  s += DATA.relations.filter(inPage).map(edgeSvg).join('');   // edges under cards
  s += entStrs.join('');
  s += DATA.notes.filter(n => (up(n.page) || 'MAIN') === up(S.page)).map(noteSvg).join('');
  return { s, matched, ents };
}

/* Widen cards whose measured text exceeds estimate, then rebuild once. */
function refine() {
  let changed = false;
  world.querySelectorAll('g.entity').forEach(g => {
    let w = 0;
    g.querySelectorAll('.frow').forEach(r => {
      const fn = r.querySelector('.fname'), ft = r.querySelector('.ftype'),
            fp = r.querySelector('.fpname'), nn = r.querySelector('.fnn');
      let nameW = 0, rightW = 0;
      try {
        if (fn) nameW = Math.max(nameW, fn.getComputedTextLength());
        if (fp) nameW = Math.max(nameW, fp.getComputedTextLength());   // stacked physical name
        if (ft) rightW += ft.getComputedTextLength();
        if (nn) rightW += 8 + nn.getComputedTextLength();              // NN badge reserve
      } catch { /* skip */ }
      w = Math.max(w, 30 + nameW + (rightW ? 12 + rightW : 0));
    });
    g.querySelectorAll('.head-l, .head-p').forEach(t => {
      try { w = Math.max(w, t.getComputedTextLength() + 16); } catch { /* skip */ }
    });
    const gm = geo.get(g.dataset.name);
    if (!gm || !w) return;
    const want = Math.max(170, Math.min(560, Math.ceil(w + 24)));
    if (want > gm.W) { gm.W = want; changed = true; }
  });
  if (!changed) return false;
  const { s } = buildSvg();                          // pass 2 with real widths
  world.innerHTML = s;
  bindCards();
  return true;
}

let selected = null;
function render(doFit = true) {
  const { s, matched, ents } = buildSvg();
  world.innerHTML = s;
  refine();
  applyDimState(matched);
  document.getElementById('hits').textContent = S.q
    ? `${matched.filter(x => x.m !== undefined).length}/${ents.length} tables` : '';
  if (!DATA.entities.length) document.getElementById('empty').style.display = 'grid';
  bindCards();
  if (doFit) fit();
}

function applyDimState(matched) {
  world.querySelectorAll('g.entity').forEach(g => g.classList.remove('dim'));
  world.querySelectorAll('g.edge').forEach(g => g.classList.remove('dim'));
  if (!S.q) return;
  const ok = new Set(matched.filter(x => x.m !== undefined).map(x => up(x.e.pName)));
  world.querySelectorAll('g.entity').forEach(g => {
    if (!ok.has(g.dataset.name)) g.classList.add('dim');
  });
  world.querySelectorAll('g.edge').forEach(g => {
    if (!ok.has(g.dataset.e) || !ok.has(g.dataset.t)) g.classList.add('dim');
  });
}

function bindCards() {
  world.querySelectorAll('g.entity').forEach(g => {
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      const name = g.dataset.name;
      selected = selected === name ? null : name;
      world.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
      world.querySelectorAll('.edge-sel').forEach(x => x.classList.remove('edge-sel'));
      if (selected) {
        g.classList.add('sel');
        world.querySelectorAll('g.edge').forEach(e => {
          if (e.dataset.e === selected || e.dataset.t === selected)
            e.classList.add('edge-sel');
        });
      }
    });
  });
}

function applyView() {
  const t = `translate(${S.view.x} ${S.view.y}) scale(${S.view.s})`;
  document.getElementById('bg').setAttribute('transform', t);
  world.setAttribute('transform', t);

  document.getElementById('zoomPct').textContent = Math.round(S.view.s * 100) + '%';
}
function fit() {
  const bb = world.getBBox();
  const W = viewport.clientWidth, H = viewport.clientHeight;
  if (!bb || !bb.width || !W || !H) { S.view = { x: 20, y: 20, s: 1 }; applyView(); return; }
  const pad = 50;
  const s = Math.min((W - pad) / bb.width, (H - pad) / bb.height, 1.6);
  S.view = { s, x: (W - bb.width * s) / 2 - bb.x * s,
                y: (H - bb.height * s) / 2 - bb.y * s };
  applyView();
}
function zoomAt(cx, cy, factor) {
  const s2 = Math.min(4, Math.max(.05, S.view.s * factor));
  const p = { x: (cx - S.view.x) / S.view.s, y: (cy - S.view.y) / S.view.s };
  S.view = { s: s2, x: cx - p.x * s2, y: cy - p.y * s2 };
  applyView();
}
viewport.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * .0016));
}, { passive: false });
let pan = null;
viewport.addEventListener('pointerdown', ev => {
  if (ev.target.closest('g.entity') || ev.target.closest('g.edge')) return;
  pan = { x: ev.clientX, y: ev.clientY, vx: S.view.x, vy: S.view.y };
  viewport.classList.add('panning');
});
window.addEventListener('pointermove', ev => {
  if (!pan) return;
  S.view.x = pan.vx + ev.clientX - pan.x;
  S.view.y = pan.vy + ev.clientY - pan.y;
  applyView();
});
window.addEventListener('pointerup', () => { pan = null; viewport.classList.remove('panning'); });
viewport.addEventListener('click', ev => {
  if (ev.target === viewport) clearSel();
});
viewport.addEventListener('dblclick', ev => { if (ev.target === viewport) fit(); });
function clearSel() {
  selected = null;
  world.querySelectorAll('.sel,.edge-sel').forEach(x => x.classList.remove('sel', 'edge-sel'));
}
document.getElementById('zIn').onclick = () =>
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
document.getElementById('zOut').onclick = () =>
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, .8);
document.getElementById('zFit').onclick = fit;
document.getElementById('z100').onclick = () => { S.view.s = 1; applyView(); };

/* --------------------------------------------------------------- tooltip */
/* Hover panel for auxiliary info (default value, comment, …) so cards stay
   compact — no layout shift. */
const tip = document.getElementById('tip');

function tipMove(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + r.width > innerWidth - 8) x = Math.max(8, ev.clientX - r.width - 16);
  if (y + r.height > innerHeight - 8) y = Math.max(8, ev.clientY - r.height - 16);
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function tipShow(html, ev) {
  tip.innerHTML = html;
  tip.style.display = 'block';
  tipMove(ev);
}
function tipHide() { tip.style.display = 'none'; }
const tipRow = (k, v, cls) => v
  ? `<tr><td>${k}</td><td class="${cls || ''}">${esc(v)}</td></tr>` : '';

function fieldTip(e, f) {
  const fk = !f.pk && fkSet.has(up(e.pName) + '\u0000' + up(f.pName));
  const badge = f.pk ? ' <span title="Primary Key">&#128273;PK</span>'
                     : fk ? ' <span title="Foreign Key">&#128279;FK</span>' : '';
  return `<div class="t-name">${esc(f.lName || f.pName)}${badge}</div>` +
    (f.pName && f.pName !== f.lName
      ? `<div class="t-sub">${esc(f.pName)}</div>` : '') +
    '<table>' +
    tipRow('Type', f.type) +
    tipRow('Constraint', f.nullConstraint) +
    tipRow('Default', f.default) +
    tipRow('Comment', f.comment, 't-cmt') +
    '</table>';
}
function entityTip(e) {
  return `<div class="t-name">${esc(e.lName || e.pName)}</div>` +
    (e.pName && e.pName !== e.lName ? `<div class="t-sub">${esc(e.pName)}</div>` : '') +
    '<table>' +
    tipRow('Comment', e.comment, 't-cmt') +
    tipRow('Page', e.page) +
    tipRow('Columns', String(e.fields.length)) +
    '</table>';
}
function edgeTip(r) {
  return `<div class="t-name">${esc(r.entity1)} &#8594; ${esc(r.entity2)}</div>` +
    '<table>' +
    tipRow('Cardinality', r.cardinality || '1:N') +
    tipRow('Fields (1)', r.fields1.join(', '), 't-cmt') +
    tipRow('Fields (2)', r.fields2.join(', '), 't-cmt') +
    '</table>';
}
const findRel = (e1, e2) => DATA.relations.find(
  r => up(r.entity1) === e1 && up(r.entity2) === e2);

world.addEventListener('pointerover', ev => {
  const entG = ev.target.closest('g.entity');
  if (entG) {
    const e = byName.get(entG.dataset.name);
    if (!e) return;
    const frow = ev.target.closest('.frow');
    if (frow) {
      const f = e.fields[+frow.dataset.idx];
      if (f) return tipShow(fieldTip(e, f), ev);
    } else if (ev.target.closest('.card-head')) {
      return tipShow(entityTip(e), ev);
    }
    return;
  }
  const edgeG = ev.target.closest('g.edge');
  if (edgeG) {
    const r = findRel(edgeG.dataset.e, edgeG.dataset.t);
    if (r) tipShow(edgeTip(r), ev);
  }
});
world.addEventListener('pointermove', ev => {
  if (tip.style.display === 'block') tipMove(ev);
});
world.addEventListener('pointerout', ev => {
  const to = ev.relatedTarget;
  if (!to || !to.closest || !to.closest('.frow, g.entity, g.edge')) tipHide();
});
viewport.addEventListener('pointerdown', tipHide);
/* --------------------------------------------------------------- chrome  */
document.getElementById('docTitle').textContent = (DATA.source || 'a5er') + ' — A5ER Viewer';
document.getElementById('meta').textContent = [
  DATA.formatVersion ? 'FORMAT ' + DATA.formatVersion : '',
  DATA.encoding, DATA.rdbms, DATA.tool,
].filter(Boolean).join(' · ');
document.getElementById('stats').textContent =
  `${DATA.entities.length} tables · ${DATA.relations.length} relations · ` +
  `${DATA.notes.length} notes · ${DATA.pages.length} pages` +
  (DATA.otherSections.length ? ` · skipped: ${DATA.otherSections.join(', ')}` : '');

const tabs = document.getElementById('tabs');
DATA.pages.forEach((p, i) => {
  const b = document.createElement('button');
  b.textContent = p;
  b.onclick = () => {
    S.page = p; clearSel();
    tabs.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render();
  };
  if (i === 0) b.classList.add('on');
  tabs.appendChild(b);
});
if (DATA.pages.length < 2) tabs.style.display = 'none';

const modeBtn = document.getElementById('modeBtn');
modeBtn.onclick = () => {
  S.mode = MODES[(MODES.indexOf(S.mode) + 1) % MODES.length];
  modeBtn.textContent = MODE_LABEL[S.mode];
  render();
};

let debounce;
const qInput = document.getElementById('q');
qInput.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { S.q = qInput.value.trim(); render(false); }, 120);
});
window.addEventListener('keydown', ev => {
  if (ev.key === '/' && document.activeElement !== qInput) {
    ev.preventDefault(); qInput.focus();
  } else if (ev.key === 'Escape') {
    if (document.activeElement === qInput) { qInput.value = ''; S.q = ''; render(false); qInput.blur(); }
    else clearSel();
  } else if (document.activeElement !== qInput) {
    if (ev.key === '0') fit();
    if (ev.key === '1') { S.view.s = 1; applyView(); }
    if (ev.key === '+' || ev.key === '=')
      zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
    if (ev.key === '-')
      zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, .8);
  }
});
window.addEventListener('resize', fit);

render();
</script>
</body>
</html>
